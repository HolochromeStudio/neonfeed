<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>BUGBYTE</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:monospace}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;line-height:0}
  #stage canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #crt{position:absolute;inset:0;pointer-events:none;display:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
  #pad{position:fixed;inset:0;pointer-events:none;--op:.75}
  .tc{position:absolute;pointer-events:auto;touch-action:none;opacity:var(--op);color:#dfe3ff;font:bold 14px monospace}
  #dpad{width:150px;height:150px;left:max(14px,env(safe-area-inset-left));bottom:18px}
  #pad.swap #dpad{left:auto;right:max(14px,env(safe-area-inset-right))}
  #btns{width:150px;height:150px;right:max(14px,env(safe-area-inset-right));bottom:18px}
  #pad.swap #btns{right:auto;left:max(14px,env(safe-area-inset-left))}
  .k{position:absolute;display:flex;align-items:center;justify-content:center;background:#2b2f55;border:3px solid #6f78c8;box-sizing:border-box}
  .k.on{background:#6f78c8;color:#10122a}
  #up{left:50px;top:0;width:50px;height:50px}#down{left:50px;top:100px;width:50px;height:50px}
  #left{left:0;top:50px;width:50px;height:50px}#right{left:100px;top:50px;width:50px;height:50px}
  #a{right:0;top:30px;width:62px;height:62px;border-radius:50%}
  #b{right:70px;top:78px;width:62px;height:62px;border-radius:50%}
  #start{position:absolute;pointer-events:auto;opacity:var(--op);top:max(10px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:70px;height:34px;font-size:12px}
  #spd{position:absolute;pointer-events:auto;opacity:var(--op);top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:70px;height:34px;font-size:12px}
  @media (pointer:fine){#pad.auto{display:none}}
</style>
</head>
<body>
<div id="app"><div id="stage"><div id="game"></div><div id="crt"></div></div></div>
<div id="pad" class="auto">
  <div id="dpad" class="tc"><div class="k" id="up">▲</div><div class="k" id="down">▼</div><div class="k" id="left">◀</div><div class="k" id="right">▶</div></div>
  <div id="btns" class="tc"><div class="k" id="b">B</div><div class="k" id="a">A</div></div>
  <div id="start" class="tc k">MENU</div>
  <div id="spd" class="tc k">RUN</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
